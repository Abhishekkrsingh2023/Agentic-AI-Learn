[project]
name = "agentic-ai-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain-core>=1.6.3",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
]

[project.scripts]
agentic-ai-learn = "agentic_ai_learn:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
